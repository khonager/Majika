name: Build Stable Apps

on:
  push:
    branches: ["stable"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.3"
  JAVA_VERSION: "17"
  APP_NAME: Majika
  CHANNEL: stable

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/${APP_NAME}-${CHANNEL}-${{ github.run_number }}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release/${APP_NAME}-${CHANNEL}-${{ github.run_number }}-android.aab"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-stable-android
          path: release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux build
        run: tar -czf "${APP_NAME}-${CHANNEL}-${{ github.run_number }}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-stable-linux-x64
          path: "*.tar.gz"
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "${{ env.APP_NAME }}-${{ env.CHANNEL }}-${{ github.run_number }}-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-stable-windows-x64
          path: "*.zip"
          if-no-files-found: error

  build-apple:
    name: Build Apple Apps
    needs: analyze
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS
        run: flutter build macos --release

      - name: Compress macOS app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find macOS .app bundle"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${APP_NAME}-${CHANNEL}-${{ github.run_number }}-macos.zip"

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign

      - name: Package iOS unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "${APP_NAME}-${CHANNEL}-${{ github.run_number }}-ios-unsigned.ipa" Payload

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: majika-stable-apple
          path: |
            *.zip
            *.ipa
          if-no-files-found: error

  build-web:
    name: Build Web
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Compress Web build
        run: tar -czf "${APP_NAME}-${CHANNEL}-${{ github.run_number }}-web.tar.gz" -C build/web .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-stable-web
          path: "*.tar.gz"
          if-no-files-found: error

  release:
    name: Publish Stable Release
    needs:
      - build-android
      - build-linux
      - build-windows
      - build-apple
      - build-web
    runs-on: ubuntu-latest
    concurrency:
      group: majika-stable-release
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Move stable-latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f stable-latest "$GITHUB_SHA"
          git push origin refs/tags/stable-latest --force

      - name: Create release body
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          {
            echo "## Majika Stable Channel"
            echo
            echo "This rolling release tracks the latest commit on \`stable\`."
            echo
            echo "- Version: $VERSION"
            echo "- Build commit: \`${GITHUB_SHA::7}\`"
            echo "- Build number: ${{ github.run_number }}"
          } > release-body.md

      - name: Update stable-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-latest
          name: Latest Stable Build
          body_path: release-body.md
          prerelease: false
          make_latest: false
          files: release/*
          target_commitish: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
