name: Majika TestFlight

on:
  push:
    branches: [unstable]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'extensions/**'
      - 'third_party/**'
      - 'ios/**'
      - 'pubspec*.yaml'
      - 'pubspec.lock'
      - '.metadata'
      - 'firebase.json'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majika-testflight
  queue: max

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      BUNDLE_ID: de.khonager.majika
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase configuration
        env:
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          umask 077
          printf '%s' "${FIREBASE_PLIST:?Missing iOS Firebase configuration}" | base64 -D > ios/Runner/GoogleService-Info.plist
          test "$(plutil -extract BUNDLE_ID raw ios/Runner/GoogleService-Info.plist)" = "$BUNDLE_ID"

      - name: Install Flutter packages and pods
        run: |
          flutter pub get
          cd ios
          pod install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing tools
        run: pipx install --python "$(command -v python)" codemagic-cli-tools==0.73.0

      - name: Configure distribution signing
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          umask 077
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE" | base64 -D > "$profiles/Majika.mobileprovision"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          keychain initialize
          keychain add-certificates --certificate "$RUNNER_TEMP/distribution.p12" --certificate-password @env:CERTIFICATE_PASSWORD
          xcode-project use-profiles --project ios/Runner.xcodeproj
          /usr/libexec/PlistBuddy -c "Print :provisioningProfiles:$BUNDLE_ID" "$HOME/export_options.plist"
          plutil -replace manageAppVersionAndBuildNumber -bool NO "$HOME/export_options.plist"

      - name: Build and verify signed IPA
        run: |
          version=$(awk '/^version:/ {split($2,v,"+"); print v[1]}' pubspec.yaml)
          # Allocate at build time so even reruns of older commits advance.
          # UTC days since 2020, hour, minute fit Apple's 4.2.2 digit limits.
          build=$(python -c 'from datetime import datetime, date, timezone; n=datetime.now(timezone.utc); print(f"{(n.date()-date(2020,1,1)).days}.{n.hour}.{n.minute}")')
          flutter build ipa --release --no-tree-shake-icons --build-name="$version" --build-number="$build" \
            --export-options-plist="$HOME/export_options.plist"
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if (( ${#ipas[@]} != 1 )); then
            echo "::error::Expected one IPA, found ${#ipas[@]}"
            exit 1
          fi
          info="$RUNNER_TEMP/ipa-info.plist"
          unzip -p "${ipas[0]}" 'Payload/Runner.app/Info.plist' > "$info"
          test "$(plutil -extract CFBundleIdentifier raw "$info")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw "$info")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$info")" = "$build"
          echo "IPA=${ipas[0]}" >> "$GITHUB_ENV"
          echo "Majika $version ($build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
