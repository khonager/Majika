name: Build Unstable Apps

on:
  push:
    branches: ["unstable"]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  APP_NAME: Majika
  RELEASE_CHANNEL: unstable

permissions:
  contents: write

concurrency:
  group: majika-unstable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing Android release signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/android-signing"
          mkdir -p "$SIGNING_DIR"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/release.keystore"

          {
            echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION-${RELEASE_CHANNEL}.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=IS_DEV=true

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION-${RELEASE_CHANNEL}.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=IS_DEV=true

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/${APP_NAME}-${RELEASE_CHANNEL}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release/${APP_NAME}-${RELEASE_CHANNEL}-android.aab"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-unstable-android
          path: release/*
          if-no-files-found: error
          retention-days: 3

  build-linux:
    name: Build Linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --dart-define=IS_DEV=true

      - name: Compress Linux build
        run: tar -czf "${APP_NAME}-${RELEASE_CHANNEL}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-unstable-linux-x64
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=IS_DEV=true

      - name: Compress Windows build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "${{ env.APP_NAME }}-${{ env.RELEASE_CHANNEL }}-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-unstable-windows-x64
          path: "*.zip"
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build macOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS
        run: flutter build macos --release --dart-define=IS_DEV=true

      - name: Compress macOS app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find macOS .app bundle"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${APP_NAME}-${RELEASE_CHANNEL}-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-unstable-macos
          path: "*.zip"
          if-no-files-found: error
          retention-days: 3

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --dart-define=IS_DEV=true

      - name: Compress Web build
        run: tar -czf "${APP_NAME}-${RELEASE_CHANNEL}-web.tar.gz" -C build/web .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: majika-unstable-web
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish Unstable Release
    needs:
      - build-android
      - build-linux
      - build-windows
      - build-macos
      - build-web
    if: ${{ always() && needs.build-android.result == 'success' && needs.build-web.result == 'success' && (github.event_name != 'workflow_dispatch' || (needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: majika-unstable-release
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Move unstable-latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f unstable-latest "$GITHUB_SHA"
          git push origin refs/tags/unstable-latest --force

      - name: Create release body
        run: |
          {
            echo "## Majika Unstable Channel"
            echo
            echo "This rolling prerelease tracks the latest commit on \`unstable\`."
            echo
            echo "- Build commit: \`${GITHUB_SHA::7}\`"
            echo "- Build number: ${{ github.run_number }}"
          } > release-body.md

      - name: Clear old unstable release assets
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'unstable-latest',
              });

              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Update unstable-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unstable-latest
          name: Latest Unstable Build
          body_path: release-body.md
          prerelease: true
          make_latest: false
          files: release/*
          target_commitish: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
